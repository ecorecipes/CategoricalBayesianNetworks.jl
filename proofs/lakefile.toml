name = "categorical_bayesian_networks_proofs"
defaultTargets = ["CategoricalBayesianNetworksProofs", "check_certificate"]
packagesDir = "../../.lake-packages"

[[require]]
name = "mdgen"
git = "https://github.com/Seasawher/mdgen"
rev = "v4.30.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[lean_lib]]
name = "CategoricalBayesianNetworksProofs"

[[require]]
name = "finite_kernels_proofs"
path = "../../FiniteKernels.jl/proofs"

[[require]]
name = "bayesian_networks_proofs"
path = "../../BayesianNetworks.jl/proofs"

[[lean_exe]]
name = "check_certificate"
root = "CertificateMain"
